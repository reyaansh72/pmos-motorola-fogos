name: Update Fogos Checksums

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fogos-checksums-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-checksums:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fogos repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            build-essential \
            wget \
            curl \
            ca-certificates \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            coreutils \
            file \
            patch \
            rsync

      - name: Clone pmbootstrap
        run: |
          git clone \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$RUNNER_TEMP/pmbootstrap"

      - name: Install pmbootstrap dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv --system-site-packages \
            "$RUNNER_TEMP/pmbootstrap-venv"

          if [ -f "$RUNNER_TEMP/pmbootstrap/requirements.txt" ]; then
            "$RUNNER_TEMP/pmbootstrap-venv/bin/pip" install \
              -r "$RUNNER_TEMP/pmbootstrap/requirements.txt"
          fi

      - name: Clone pmaports
        run: |
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$RUNNER_TEMP/pmaports"

      - name: Copy Fogos packages into downstream
        shell: bash
        run: |
          set -euo pipefail

          APORTS="$RUNNER_TEMP/pmaports"
          DEST="$APORTS/device/downstream"

          mkdir -p "$DEST"

          for pkg in linux-motorola-fogos device-motorola-fogos; do
            apkbuild="$(find "$GITHUB_WORKSPACE" \
              -type f -path "*/$pkg/APKBUILD" \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$apkbuild" ]; then
              echo "::error::APKBUILD not found for $pkg"
              exit 1
            fi

            source_dir="$(dirname "$apkbuild")"
            target_dir="$DEST/$pkg"

            mkdir -p "$target_dir"
            cp -a "$source_dir/." "$target_dir/"

            if [ "$pkg" = "linux-motorola-fogos" ]; then
              echo "SOURCE_KERNEL_DIR=$source_dir" >> "$GITHUB_ENV"
              echo "TARGET_KERNEL_DIR=$target_dir" >> "$GITHUB_ENV"
            else
              echo "SOURCE_DEVICE_DIR=$source_dir" >> "$GITHUB_ENV"
              echo "TARGET_DEVICE_DIR=$target_dir" >> "$GITHUB_ENV"
            fi
          done

      - name: Create pmbootstrap config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$RUNNER_TEMP/pmbootstrap.cfg"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$RUNNER_TEMP/pmaports"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cat > "$CONFIG" <<EOF
          [pmbootstrap]
          aports = $APORTS
          auto_zap_misconfigured_chroots = no
          boot_size = 512
          build_default_device_arch = False
          build_pkgs_on_install = True
          ccache_size = 5G
          device = generic-x86_64
          extra_packages = none
          extra_space = 0
          hostname =
          is_default_channel = False
          jobs = 2
          kernel = stable
          keymap =
          locale = en_US.UTF-8
          qemu_redir_stdio = False
          service_manager = openrc
          ssh_key_glob = ~/.ssh/*.pub
          ssh_keys = False
          sudo_timer = False
          timezone = Asia/Kolkata
          ui = console
          ui_extras = False
          user = runner
          work = $WORK

          [providers]

          [mirrors]
          alpine = http://cdn.alpinelinux.org/
          alpine_custom = none
          pmaports = http://mirror.postmarketos.org/postmarketos/
          pmaports_custom = none
          systemd = http://mirror.postmarketos.org/postmarketos/extra-repos/systemd/
          systemd_custom = none
          EOF

          echo "PMBOOTSTRAP_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Initialize pmbootstrap non-interactively
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            -c "$PMBOOTSTRAP_CONFIG" \
            -y init

      - name: Update kernel checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            -c "$PMBOOTSTRAP_CONFIG" \
            checksum linux-motorola-fogos

      - name: Update device checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            -c "$PMBOOTSTRAP_CONFIG" \
            checksum device-motorola-fogos

      - name: Copy updated APKBUILD files back
        shell: bash
        run: |
          set -euo pipefail

          cp "$TARGET_KERNEL_DIR/APKBUILD" "$SOURCE_KERNEL_DIR/APKBUILD"
          cp "$TARGET_DEVICE_DIR/APKBUILD" "$SOURCE_DEVICE_DIR/APKBUILD"

      - name: Commit and push checksum updates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$SOURCE_KERNEL_DIR/APKBUILD" \
            "$SOURCE_DEVICE_DIR/APKBUILD"

          if git diff --cached --quiet; then
            echo "No checksum changes detected."
            exit 0
          fi

          last_number=$(
            git log --format='%s' |
              sed -nE \
                's/^update\(checksums\): Updated Checksums #([0-9]+)$/\1/p' |
              sort -n |
              tail -n 1
          )

          last_number="${last_number:-0}"
          next_number=$((last_number + 1))

          commit_message="update(checksums): Updated Checksums #${next_number}"

          git commit -m "$commit_message"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Pushed: $commit_message"
