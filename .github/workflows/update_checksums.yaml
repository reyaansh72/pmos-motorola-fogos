name: Update Fogos Checksums

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fogos-checksums-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-checksums:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fogos repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            build-essential \
            wget \
            curl \
            ca-certificates \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            coreutils \
            file \
            patch \
            rsync \
            expect

      - name: Clone pmbootstrap
        run: |
          git clone \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$RUNNER_TEMP/pmbootstrap"

      - name: Install pmbootstrap dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv --system-site-packages \
            "$RUNNER_TEMP/pmbootstrap-venv"

          if [ -f "$RUNNER_TEMP/pmbootstrap/requirements.txt" ]; then
            "$RUNNER_TEMP/pmbootstrap-venv/bin/pip" install \
              -r "$RUNNER_TEMP/pmbootstrap/requirements.txt"
          fi

      - name: Clone pmaports
        run: |
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$RUNNER_TEMP/pmaports"

      - name: Copy Fogos packages into downstream
        shell: bash
        run: |
          set -euo pipefail

          APORTS="$RUNNER_TEMP/pmaports"
          DEST="$APORTS/device/downstream"

          mkdir -p "$DEST"

          for pkg in linux-motorola-fogos device-motorola-fogos; do
            apkbuild="$(find "$GITHUB_WORKSPACE" \
              -type f -path "*/$pkg/APKBUILD" \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$apkbuild" ]; then
              echo "::error::APKBUILD not found for $pkg"
              exit 1
            fi

            source_dir="$(dirname "$apkbuild")"
            target_dir="$DEST/$pkg"

            mkdir -p "$target_dir"
            cp -a "$source_dir/." "$target_dir/"

            if [ "$pkg" = "linux-motorola-fogos" ]; then
              echo "SOURCE_KERNEL_DIR=$source_dir" >> "$GITHUB_ENV"
              echo "TARGET_KERNEL_DIR=$target_dir" >> "$GITHUB_ENV"
            else
              echo "SOURCE_DEVICE_DIR=$source_dir" >> "$GITHUB_ENV"
              echo "TARGET_DEVICE_DIR=$target_dir" >> "$GITHUB_ENV"
            fi
          done

      - name: Initialize pmbootstrap non-interactively
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$RUNNER_TEMP/pmbootstrap.cfg"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          APORTS="$RUNNER_TEMP/pmaports"

          rm -f "$CONFIG"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          cat > "$RUNNER_TEMP/init.exp" <<'EXPECT'
          set timeout 900
          log_user 1

          set pmb [lindex $argv 0]
          set config [lindex $argv 1]
          set work [lindex $argv 2]
          set aports [lindex $argv 3]

          spawn python3 $pmb -c $config init

          expect {
              -re {Work path.*\]: *$} {
                  send -- "$work\r"
                  exp_continue
              }
              -re {pmaports path.*\]: *$} {
                  send -- "$aports\r"
                  exp_continue
              }
              -re {Channel \[.*\]: *$} {
                  send -- "edge\r"
                  exp_continue
              }
              -re {Vendor \[.*\]: *$} {
                  send -- "generic\r"
                  exp_continue
              }
              -re {Device codename \[.*\]: *$} {
                  send -- "x86_64\r"
                  exp_continue
              }
              -re {Kernel \[.*\]: *$} {
                  send -- "stable\r"
                  exp_continue
              }
              -re {Username \[.*\]: *$} {
                  send -- "runner\r"
                  exp_continue
              }
              -re {Provider \[default\]: *$} {
                  send -- "\r"
                  exp_continue
              }
              -re {User interface \[.*\]: *$} {
                  send -- "console\r"
                  exp_continue
              }
              -re {service manager.*\]: *$} {
                  send -- "openrc\r"
                  exp_continue
              }
              -re {Change them\? \(y/n\).*$} {
                  send -- "n\r"
                  exp_continue
              }
              -re {Extra packages \[.*\]: *$} {
                  send -- "none\r"
                  exp_continue
              }
              -re {Use this timezone.*\? \(y/n\).*$} {
                  send -- "y\r"
                  exp_continue
              }
              -re {Locale \[.*\]: *$} {
                  send -- "en_US\r"
                  exp_continue
              }
              -re {Device hostname.*\]: *$} {
                  send -- "fogos-checksums\r"
                  exp_continue
              }
              -re {Build outdated packages.*\? \(y/n\).*$} {
                  send -- "n\r"
                  exp_continue
              }
              -re {Zap existing chroots.*\? \(y/n\).*$} {
                  send -- "y\r"
                  exp_continue
              }
              eof {
                  catch wait result
                  exit [lindex $result 3]
              }
              timeout {
                  puts stderr "Timed out waiting for a pmbootstrap init prompt."
                  exit 1
              }
          }
          EXPECT

          expect "$RUNNER_TEMP/init.exp" \
            "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            "$CONFIG" \
            "$WORK" \
            "$APORTS"

      - name: Update kernel checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            -c "$RUNNER_TEMP/pmbootstrap.cfg" \
            checksum linux-motorola-fogos

      - name: Update device checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" \
            -c "$RUNNER_TEMP/pmbootstrap.cfg" \
            checksum device-motorola-fogos

      - name: Copy updated APKBUILD files back
        shell: bash
        run: |
          set -euo pipefail

          cp "$TARGET_KERNEL_DIR/APKBUILD" "$SOURCE_KERNEL_DIR/APKBUILD"
          cp "$TARGET_DEVICE_DIR/APKBUILD" "$SOURCE_DEVICE_DIR/APKBUILD"

      - name: Commit and push checksum updates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$SOURCE_KERNEL_DIR/APKBUILD" \
            "$SOURCE_DEVICE_DIR/APKBUILD"

          if git diff --cached --quiet; then
            echo "No checksum changes detected."
            exit 0
          fi

          last_number=$(
            git log --format='%s' |
              sed -nE \
                's/^update\(checksums\): Updated Checksums #([0-9]+)$/\1/p' |
              sort -n |
              tail -n 1
          )

          last_number="${last_number:-0}"
          next_number=$((last_number + 1))

          commit_message="update(checksums): Updated Checksums #${next_number}"

          git commit -m "$commit_message"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Pushed: $commit_message"
