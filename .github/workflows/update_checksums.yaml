name: Update Fogos Checksums

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fogos-checksums-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-checksums:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            build-essential \
            sudo \
            wget \
            curl \
            ca-certificates \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            coreutils \
            file \
            patch \
            rsync

      - name: Clone pmbootstrap
        run: |
          git clone \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$RUNNER_TEMP/pmbootstrap"

      - name: Install pmbootstrap dependencies
        run: |
          python3 -m venv --system-site-packages \
            "$RUNNER_TEMP/pmbootstrap-venv"

          if [ -f "$RUNNER_TEMP/pmbootstrap/requirements.txt" ]; then
            "$RUNNER_TEMP/pmbootstrap-venv/bin/pip" install \
              -r "$RUNNER_TEMP/pmbootstrap/requirements.txt"
          fi

      - name: Show pmbootstrap version
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" --version

      - name: Configure pmbootstrap
        env:
          PMBOOTSTRAP_WORK: ${{ runner.temp }}/pmbootstrap-work
        run: |
          mkdir -p "$PMBOOTSTRAP_WORK"

          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" init \
            --aports "$GITHUB_WORKSPACE" \
            --work "$PMBOOTSTRAP_WORK" \
            --mirror-pmOS https://mirror.postmarketos.org/postmarketos/

      - name: Update kernel checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" checksum \
            linux-motorola-fogos

      - name: Update device checksums
        run: |
          python3 "$RUNNER_TEMP/pmbootstrap/pmbootstrap.py" checksum \
            device-motorola-fogos

      - name: Commit and push checksum updates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the two package APKBUILD files only.
          git add -- \
            ':(glob)**/linux-motorola-fogos/APKBUILD' \
            ':(glob)**/device-motorola-fogos/APKBUILD' \
            ':(glob)APKBUILD'

          if git diff --cached --quiet; then
            echo "No checksum changes detected."
            exit 0
          fi

          # Find the highest existing checksum commit number.
          last_number=$(
            git log --all --format='%s' |
              sed -nE \
                's/^update\(checksums\): Updated Checksums #([0-9]+)$/\1/p' |
              sort -n |
              tail -n 1
          )

          last_number="${last_number:-0}"
          next_number=$((last_number + 1))

          commit_message="update(checksums): Updated Checksums #${next_number}"

          git commit -m "$commit_message"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Successfully pushed: $commit_message"
